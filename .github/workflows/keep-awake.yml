# Free Hugging Face Spaces sleep after 48 hours without visits. Set the repository
# variable SPACE_URL (e.g. https://<user>-tamang-sahod.hf.space) to enable.
# GitHub pauses scheduled workflows after 60 days without repository activity.
name: keep-awake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.SPACE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 30 --max-time 180 "${{ vars.SPACE_URL }}/health"
