{# Line icons for the calculator tiles: 24px, stroke in the current text colour. #}
{% macro icon(topic) %}
<svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if topic == 'salary' %}<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5v5M18 9.5v5"/>
{% elif topic == 'thirteenth' %}<rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M12 8v13M5.5 12v9h13v-9"/><path d="M12 8C10.5 5 7 5 7 6.8 7 8 9 8 12 8zm0 0c1.5-3 5-3 5-1.2C17 8 15 8 12 8z"/>
{% elif topic == 'holiday' %}<rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/><path d="M12 12.5l1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z"/>
{% elif topic == 'final' %}<path d="M14 3.5h4.5a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H14"/><path d="M9.5 16.5 5 12l4.5-4.5M5 12h11"/>
{% else %}<path d="M12 3l7.5 3v5.5c0 4.7-3.2 7.9-7.5 9.5-4.3-1.6-7.5-4.8-7.5-9.5V6z"/><path d="M9 12l2 2 4-4"/>
{% endif %}
</svg>
{% endmacro %}

{% macro tiles(forms, topics) %}
<ul class="tiles">
  {% for topic in topics %}
  <li><a href="/calc/{{ topic }}">{{ icon(topic) }}<strong>{{ forms[topic].title }}</strong><span>{{ forms[topic].blurb }}</span></a></li>
  {% endfor %}
</ul>
{% endmacro %}
